<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <meta name="robots" content="noindex">
  <title>Battle Log</title>
  <link rel="stylesheet" href="/assets/battle-log.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="eyebrow">BATTLE LOG</div>
      <h1 id="title">Memuat…</h1>
      <p id="subtitle" class="muted"></p>
    </header>

    <section id="error" class="card error" hidden>
      <strong>Log tidak ditemukan</strong>
      <p id="error-text" class="muted"></p>
    </section>

    <div id="content" hidden>
      <div class="col">
        <section class="card arena-card">
          <div class="arena">
            <div class="side" id="side-player"></div>
            <div class="mid">
              <div class="turn-badge" id="turn-badge">TURN 1</div>
              <div class="vs">VS</div>
            </div>
            <div class="side" id="side-enemy"></div>
          </div>
        </section>

        <section class="card">
          <div class="controls">
            <button id="btn-prev" class="btn" type="button" title="Aksi sebelumnya">◀</button>
            <button id="btn-play" class="btn primary" type="button">Putar</button>
            <button id="btn-next" class="btn" type="button" title="Aksi berikutnya">▶</button>
            <input id="seek" class="seek" type="range" min="0" max="0" value="0" step="1" aria-label="Posisi aksi">
            <span class="counter" id="counter">0 / 0</span>
            <label class="speed">
              <span class="muted">Kecepatan</span>
              <select id="speed">
                <option value="1200">0,5×</option>
                <option value="700" selected>1×</option>
                <option value="400">1,5×</option>
                <option value="220">2×</option>
              </select>
            </label>
          </div>
          <div class="now" id="now"></div>
        </section>

        <section class="card">
          <div class="meta" id="meta"></div>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <div class="toolbar">
            <label class="check"><input type="checkbox" id="filter-all"> Tampilkan semua kejadian</label>
            <span class="muted" id="count"></span>
          </div>
          <div id="feed" class="feed"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="/assets/battle-log.js"></script>
</body>
</html>
